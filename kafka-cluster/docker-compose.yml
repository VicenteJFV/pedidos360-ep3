# Cluster Kafka para EP3 - Pedidos360
#
# Arquitectura de la seccion 3 de la guia de EP3: tres nodos ZooKeeper, tres
# brokers y Kafka UI. Las imagenes son las de las guias practicas 3.1 a 3.3
# (confluentinc 7.5.0); la diferencia es que alla habia un solo broker y aca
# hay tres, porque los dos topicos del caso exigen factor de replicacion 3.
#
#   zookeeper-1  2181         kafka-1  localhost:29092 (host)  kafka-1:9092 (red Docker)
#   zookeeper-2  2182         kafka-2  localhost:39092 (host)  kafka-2:9092 (red Docker)
#   zookeeper-3  2183         kafka-3  localhost:49092 (host)  kafka-3:9092 (red Docker)
#   kafka-ui     http://localhost:8090
#
# Kafka UI se publica en 8090 y no en 8080 como en la tabla de la guia: en este
# proyecto el 8080 es el BFF desde EP1. Las propias guias practicas ya lo movian
# (8081:8080) por la misma razon, solo que el 8081 aqui es ms-pedidos360-orders.
#
# Cada broker tiene dos listeners, como el kafka-broker de las guias:
#   INTERNAL  kafka-N:9092     lo usan los otros brokers, Kafka UI y los
#                              microservicios que corren dentro de Docker.
#   EXTERNAL  localhost:N9092  lo usan los microservicios que corren en el
#                              equipo anfitrion (mvn spring-boot:run).
#
# Los tres brokers corren en el mismo equipo: el cluster tolera la caida de un
# broker, pero no la del equipo completo (seccion 3.2 de la guia).

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped
  networks: [kafka-net]

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  networks: [kafka-net]
  depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2182,zookeeper-3:2183
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Como en las guias: un topico solo existe si alguien lo crea a proposito.
  # Asi un nombre mal escrito en un productor falla en vez de crear un topico
  # nuevo con valores por defecto.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Con tres brokers, los topicos internos tambien se replican tres veces. En
  # las guias valian 1 porque habia un solo broker.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  # Un registro se confirma (acks=all) cuando lo tienen al menos 2 de las 3
  # replicas. Asi se puede caer un broker sin dejar de aceptar escrituras.
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # La imagen reserva 1 GB por broker si no se le dice otra cosa.
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

services:
  zookeeper-1:
    <<: *zookeeper
    container_name: zookeeper-1
    hostname: zookeeper-1
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms128m"

  zookeeper-2:
    <<: *zookeeper
    container_name: zookeeper-2
    hostname: zookeeper-2
    ports: ["2182:2182"]
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms128m"

  zookeeper-3:
    <<: *zookeeper
    container_name: zookeeper-3
    hostname: zookeeper-3
    ports: ["2183:2183"]
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2183
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms128m"

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    ports: ["39092:39092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:39092

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    ports: ["49092:49092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:49092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:49092

  # Crea los topicos del caso con kafka-topics, el mismo comando de las guias
  # practicas, y termina. --if-not-exists lo hace idempotente: en cada arranque
  # confirma que existen sin tocar los que ya estan.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks: [kafka-net]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    volumes:
      - ./crear-topicos.sh:/crear-topicos.sh:ro
    entrypoint: ["bash", "/crear-topicos.sh"]
    restart: "no"

  kafka-ui:
    # La guia usa la etiqueta latest; se fija v0.7.2, que es la version a la
    # que apunta latest, para que el entorno no cambie solo entre ensayos.
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    networks: [kafka-net]
    depends_on:
      kafka-1: { condition: service_healthy }
    ports: ["8090:8080"]
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181
    restart: unless-stopped

networks:
  kafka-net:
    name: kafka-net
    driver: bridge
