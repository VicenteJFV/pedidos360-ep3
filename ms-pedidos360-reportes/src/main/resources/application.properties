spring.application.name=ms-pedidos360-reportes

# 8085, el puerto que usa kafka-errores-dto en la guia 3.3.2.
server.port=8085
# Como los demas microservicios: solo loopback por defecto. En Docker,
# MS_BIND_ADDRESS=0.0.0.0 y sin publicar el puerto hacia afuera.
server.address=${MS_BIND_ADDRESS:127.0.0.1}

spring.profiles.active=${SPRING_PROFILE:dev}

# ---------------------------------------------------------------------------
# Conexion a Kafka
# ---------------------------------------------------------------------------
# Los tres brokers. Dentro de Docker: KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}

# ---------------------------------------------------------------------------
# Configuracion del consumidor (guia 3.3.2, etapa 2)
# ---------------------------------------------------------------------------
# Cada @KafkaListener declara su propio consumer group: reportes-pedidos lee
# pedidos-eventos y reportes-auditoria lee pedidos-auditoria. Asi el avance
# (offsets y lag) de cada topico se observa por separado en Kafka UI.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ErrorHandlingDeserializer envuelve al deserializador JSON. Si llega un mensaje
# que no es JSON valido, no revienta el consumidor en bucle: el error pasa al
# DefaultErrorHandler, que lo manda al DLT y sigue con el siguiente.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.pedidos360.reportes.model
# El productor no manda la cabecera __TypeId__: el tipo lo fija cada listener
# con spring.json.value.default.type (ver los consumidores).
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Tres hilos por listener, uno por particion: el consumer group queda con tres
# miembros y cada uno recibe una particion. Es la "distribucion del consumo" de
# la seccion 6.2 de la guia, visible en Kafka UI -> Consumers.
spring.kafka.listener.concurrency=3

# ---------------------------------------------------------------------------
# Configuracion del productor: solo la usa el DeadLetterPublishingRecoverer
# para escribir en los DLT. Este microservicio no publica eventos del negocio.
# ---------------------------------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# ---------------------------------------------------------------------------
# Reintentos (DefaultErrorHandler + FixedBackOff, como la guia 3.3.2)
# ---------------------------------------------------------------------------
# 1 intento + 2 reintentos separados por 1 s; despues, al DLT.
reportes.reintentos.intervalo-ms=1000
reportes.reintentos.maximo=2

# Base de datos: las tablas las crea schema.sql en el primer arranque. En Oracle
# el segundo arranque falla con ORA-00955 (la tabla ya existe) y se sigue: es lo
# esperado, porque Oracle 19c no tiene CREATE TABLE IF NOT EXISTS.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.cl.duoc.pedidos360=INFO
