# Perfil oracle: la misma Autonomous Database del proyecto (ver
# ms-pedidos360-orders/src/main/resources/application-oracle.properties).
# La conexion se define por variables de entorno, nunca aqui:
#
#   ORACLE_JDBC_URL=jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=C:/dev/pedidos360-ep3/wallet
#   ORACLE_USER=...
#   ORACLE_PASSWORD=...
#
# El wallet NUNCA va al repositorio: la carpeta wallet/ esta en el .gitignore.

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool reducido, como en la guia 3.3.2: la base Always Free admite pocas
# sesiones y la comparten los tres microservicios con datos.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
