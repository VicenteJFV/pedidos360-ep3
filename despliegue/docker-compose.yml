# Despliegue en la EC2 (EP1 + EP2 + EP3): toda la solucion en una sola red de
# Docker, con Docker Compose:
#
#   frontend     Angular servido por nginx               :80    publico
#   bff          BFF de EP1, ahora en contenedor          :8080  publico
#   orders, catalog, notify, rabbitadmin                  127.0.0.1 solamente
#   reportes, kafkaadmin (EP3)                            127.0.0.1 solamente
#   rabbitmq-1, rabbitmq-2  cluster de dos nodos          Management publico
#   zookeeper-1..3, kafka-1..3  cluster Kafka (EP3)       solo red interna
#   kafka-ui     Kafka UI (EP3)                           :8090  publico, con login
#
# Que es publico y por que:
#
#   80 y 8080   El navegador no entra directo: pasa por el API Gateway, que
#               reenvia /app/... al frontend y /api/... al BFF. El API Gateway
#               los alcanza desde Internet, asi que el Security Group los abre.
#               El API Gateway aporta el HTTPS que Entra ID exige.
#   15672/3     RabbitMQ Management, publicado como en las guias del curso
#               ("15672:15672" y "15673:15672"). Lo protege su propio login,
#               con un usuario generado al desplegar: no existe guest/guest.
#   8090        Kafka UI. La guia la publica en 8080, que aqui es el BFF. A
#               diferencia del laboratorio local, queda en Internet, y Kafka UI
#               permite borrar topicos: por eso lleva login (AUTH_TYPE), con un
#               usuario generado al desplegar, igual que RabbitMQ.
#   el resto    Microservicios y API administradora solo en 127.0.0.1 de la
#               EC2. Se usan por tunel SSH (aws/08-tunel-demo.ps1).
#
# Archivos que este Compose espera y que NO estan en git, porque los genera
# aws/07-desplegar-ep2.ps1 directamente en la EC2:
#
#   despliegue/.env              cookie de Erlang del cluster (RABBITMQ_COOKIE)
#                                , credenciales de RabbitMQ (RABBITMQ_USER/PASS)
#                                y de Kafka UI (KAFKAUI_USER/PASS)
#   despliegue/oracle.env        ORACLE_USER y ORACLE_PASSWORD
#   despliegue/rabbitmq-usuario.conf   usuario por defecto del broker
#   wallet/                      wallet de la Autonomous Database
#
# Las imagenes de los microservicios se construyen antes con docker build
# (ver despliegue/instalar-en-ec2.sh) y aqui solo se referencian por nombre.

name: pedidos360

x-rabbitmq-comun: &rabbitmq-comun
  image: rabbitmq:4.2.9-management
  restart: unless-stopped
  environment:
    # RABBITMQ_ERLANG_COOKIE no sirve en RabbitMQ 4.x: la cookie se fija por los
    # argumentos de Erlang, del servidor y de rabbitmqctl. Aqui viene de .env y
    # no de un valor escrito en git, como en el cluster de desarrollo.
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_COOKIE:?falta RABBITMQ_COOKIE en despliegue/.env}"
    RABBITMQ_CTL_ERL_ARGS: "-setcookie ${RABBITMQ_COOKIE}"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
  networks: [pedidos360]

x-microservicio: &microservicio
  restart: unless-stopped
  networks: [pedidos360]
  environment: &entorno-comun
    # Escuchar en todas las interfaces DEL CONTENEDOR: si escuchara en su
    # loopback, la publicacion de puertos no le llegaria. Lo que limita el
    # acceso es el 127.0.0.1 de la seccion ports, que es el loopback del host.
    MS_BIND_ADDRESS: 0.0.0.0
    RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
    RABBITMQ_USER: ${RABBITMQ_USER:?falta RABBITMQ_USER en despliegue/.env}
    RABBITMQ_PASS: ${RABBITMQ_PASS:?falta RABBITMQ_PASS en despliegue/.env}
    # EP3: dentro de la red de Docker los clientes Kafka usan el listener
    # INTERNAL de los tres brokers (seccion 3.1 de la guia de EP3).
    KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    # La EC2 comparte su memoria entre siete JVM de microservicios, dos nodos de
    # RabbitMQ y el cluster Kafka. Sin techo, cada JVM reserva un cuarto de la
    # memoria del host y entre todas lo agotan. SerialGC gasta menos memoria que G1 y estos
    # servicios no la necesitan.
    JAVA_OPTS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC

# ---------------------------------------------------------------------------
# EP3: cluster Kafka. Es la configuracion de la guia practica 3.4 -la misma de
# kafka-cluster/docker-compose.yml, que es la del laboratorio local-: Confluent
# 7.6.1, tres ZooKeeper, tres brokers y sus limites de memoria.
# ---------------------------------------------------------------------------
x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  networks: [pedidos360]

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  KAFKA_HEAP_OPTS: "-Xms64M -Xmx128M"

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  networks: [pedidos360]
  depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"

services:

  rabbitmq-1:
    <<: *rabbitmq-comun
    hostname: rabbitmq-1
    container_name: rabbitmq-1
    volumes:
      - ../rabbitmq-cluster/rabbitmq-1/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-usuario.conf:/etc/rabbitmq/conf.d/20-usuario.conf:ro
      - rabbitmq1_data:/var/lib/rabbitmq
    ports:
      # Como en las guias: en todas las interfaces. Ver el encabezado.
      - "15672:15672"

  rabbitmq-2:
    <<: *rabbitmq-comun
    hostname: rabbitmq-2
    container_name: rabbitmq-2
    volumes:
      - ../rabbitmq-cluster/rabbitmq-2/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-usuario.conf:/etc/rabbitmq/conf.d/20-usuario.conf:ro
      - rabbitmq2_data:/var/lib/rabbitmq
    ports:
      - "15673:15672"

  catalog:
    <<: *microservicio
    image: pedidos360/catalog:ep2
    container_name: ms-pedidos360-catalog
    env_file: oracle.env
    environment:
      <<: *entorno-comun
      SPRING_PROFILE: oracle
      TNS_ADMIN: /app/wallet
      ORACLE_JDBC_URL: jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=/app/wallet
    volumes:
      - ../wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8082:8082"

  orders:
    <<: *microservicio
    image: pedidos360/orders:ep2
    container_name: ms-pedidos360-orders
    env_file: oracle.env
    environment:
      <<: *entorno-comun
      SPRING_PROFILE: oracle
      TNS_ADMIN: /app/wallet
      ORACLE_JDBC_URL: jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=/app/wallet
      CATALOG_BASE_URL: http://catalog:8082
    volumes:
      - ../wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      rabbitmq-1: { condition: service_healthy }
      catalog: { condition: service_started }

  notify:
    <<: *microservicio
    image: pedidos360/notify:ep2
    container_name: ms-pedidos360-notify
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      rabbitmq-1: { condition: service_healthy }

  rabbitadmin:
    <<: *microservicio
    image: pedidos360/rabbitadmin:ep2
    container_name: ms-pedidos360-rabbitadmin
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      rabbitmq-1: { condition: service_healthy }

  bff:
    image: pedidos360/bff:ep2
    container_name: bff-pedidos360
    restart: unless-stopped
    networks: [pedidos360]
    environment:
      # Dentro de la red de Docker pedidos y catalogo se llaman por su nombre de
      # servicio. En EP1 eran 127.0.0.1 porque todo corria en el host.
      MICROSERVICIOS_ORDERS_BASEURL: http://orders:8081
      MICROSERVICIOS_CATALOG_BASEURL: http://catalog:8082
      # La API administradora de RabbitMQ entra por el BFF, solo para Admin.
      MICROSERVICIOS_RABBITADMIN_BASEURL: http://rabbitadmin:8084
      # EP3: administracion de Kafka y reporteria, tambien solo para Admin.
      MICROSERVICIOS_KAFKAADMIN_BASEURL: http://kafkaadmin:8086
      MICROSERVICIOS_REPORTES_BASEURL: http://reportes:8085
      # Sin configuracion de CORS: se resuelve en el API Gateway.
      JAVA_OPTS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC
    ports:
      # Publico: es el destino del API Gateway, que lo alcanza desde Internet.
      # Era asi tambien en EP1.
      - "8080:8080"
    depends_on:
      orders: { condition: service_started }
      catalog: { condition: service_started }
      rabbitadmin: { condition: service_started }

  # -------------------------------------------------------------------------
  # EP3: Kafka
  # -------------------------------------------------------------------------
  # Los puertos de ZooKeeper y los EXTERNAL de los brokers (29092, 39092,
  # 49092) se publican solo en 127.0.0.1 de la EC2: en la nube todos los
  # clientes estan dentro de la red de Docker y usan kafka-N:9092. Nada de
  # Kafka queda abierto a Internet salvo Kafka UI, que tiene login.

  zookeeper-1:
    <<: *zookeeper
    container_name: zookeeper-1
    hostname: zookeeper-1
    ports: ["127.0.0.1:2181:2181"]
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log

  zookeeper-2:
    <<: *zookeeper
    container_name: zookeeper-2
    hostname: zookeeper-2
    ports: ["127.0.0.1:2182:2181"]
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log

  zookeeper-3:
    <<: *zookeeper
    container_name: zookeeper-3
    hostname: zookeeper-3
    ports: ["127.0.0.1:2183:2181"]
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    ports: ["127.0.0.1:29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    ports: ["127.0.0.1:39092:39092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:39092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:39092"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    ports: ["127.0.0.1:49092:49092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:49092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:49092"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # Crea pedidos-eventos, pedidos-auditoria y sus DLT (3 particiones, factor 3)
  # y termina. Idempotente: en cada arranque confirma que existen.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    networks: [pedidos360]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    volumes:
      - ../kafka-cluster/crear-topicos.sh:/crear-topicos.sh:ro
    entrypoint: ["bash", "/crear-topicos.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
    networks: [pedidos360]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ClusterKafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms64m -Xmx192m"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKAUI_USER:?falta KAFKAUI_USER en despliegue/.env}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKAUI_PASS:?falta KAFKAUI_PASS en despliegue/.env}

  # Consumidor Kafka: reporteria y auditoria, sobre la misma base Oracle.
  reportes:
    <<: *microservicio
    image: pedidos360/reportes:ep2
    container_name: ms-pedidos360-reportes
    env_file: oracle.env
    environment:
      <<: *entorno-comun
      SPRING_PROFILE: oracle
      TNS_ADMIN: /app/wallet
      ORACLE_JDBC_URL: jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=/app/wallet
    volumes:
      - ../wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  kafkaadmin:
    <<: *microservicio
    image: pedidos360/kafkaadmin:ep2
    container_name: ms-pedidos360-kafkaadmin
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      kafka-1: { condition: service_healthy }

  frontend:
    image: pedidos360/frontend:ep2
    container_name: frontend-pedidos360
    restart: unless-stopped
    networks: [pedidos360]
    ports:
      # Publico, por la misma razon que el BFF: el API Gateway reenvia aqui las
      # peticiones a /app/... y es quien da el HTTPS.
      - "80:80"

networks:
  pedidos360:

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
