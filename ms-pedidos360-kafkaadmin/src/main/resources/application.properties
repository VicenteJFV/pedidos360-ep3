spring.application.name=ms-pedidos360-kafkaadmin

# Puerto interno del administrador Kafka. La guia 3.4.1 usa 8082, que en este
# proyecto es el catalogo; 8086 sigue a rabbitadmin (8084) y reportes (8085).
# Como rabbitadmin, va detras del API Gateway y del BFF.
server.port=8086
server.address=${MS_BIND_ADDRESS:127.0.0.1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Conexion al cluster (guia 3.4.1, seccion 5)
# ---------------------------------------------------------------------------
# Los tres brokers: la administracion tiene que seguir funcionando con uno
# caido, que es justo cuando mas falta hace mirar el estado de las replicas.
# Fuera de Docker se usan los puertos externos; dentro de Docker,
# KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
kafka.admin.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}

# Cuanto espera cada operacion del AdminClient antes de responder con error.
# La guia usa get() sin limite: si el cluster no responde, la peticion HTTP
# quedaria colgada.
kafkaadmin.timeout-segundos=10

logging.level.cl.duoc.pedidos360=INFO
