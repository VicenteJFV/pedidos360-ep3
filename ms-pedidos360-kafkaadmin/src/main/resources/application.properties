spring.application.name=ms-pedidos360-kafkaadmin

# Puerto interno del administrador Kafka. Como rabbitadmin (8084), va detras
# del API Gateway y del BFF: la administracion no queda expuesta.
server.port=8086
server.address=${MS_BIND_ADDRESS:127.0.0.1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Conexion al cluster
# ---------------------------------------------------------------------------
# Los tres brokers: la administracion tiene que seguir funcionando con uno
# caido, que es justo cuando mas falta hace mirar el estado de las replicas.
# Dentro de Docker: KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}

# Cuanto espera cada operacion del AdminClient antes de responder con error.
kafkaadmin.timeout-segundos=10

logging.level.cl.duoc.pedidos360=INFO
