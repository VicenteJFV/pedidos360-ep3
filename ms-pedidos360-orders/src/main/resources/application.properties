spring.application.name=ms-pedidos360-orders

# Puerto interno del microservicio principal.
server.port=8081

# SEGURIDAD DE RED: escucha SOLO en loopback por defecto. Ver comentario equivalente
# en el catalogo. En Docker con red bridge: MS_BIND_ADDRESS=0.0.0.0 y sin -p.
server.address=${MS_BIND_ADDRESS:127.0.0.1}

spring.profiles.active=${SPRING_PROFILE:dev}

# Destino del microservicio de catalogo. En EC2 ambos corren en la misma instancia.
catalog.base-url=${CATALOG_BASE_URL:http://localhost:8082}
catalog.connect-timeout=5s
catalog.read-timeout=10s

spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.cl.duoc.pedidos360=INFO
# ---------------------------------------------------------------------------
# RabbitMQ (EP2)
# ---------------------------------------------------------------------------
# Se declaran los dos endpoints del cluster y no un host unico: asi Spring sabe
# a quien reconectarse cuando el nodo que estaba usando deja de responder. Con
# spring.rabbitmq.host solo habria un destino posible y la caida de ese nodo
# dejaria al productor sin broker, aunque el otro siguiera en pie.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Confirmaciones del broker. Sin esto, convertAndSend devuelve de inmediato y
# un mensaje perdido antes de llegar al broker pasaria inadvertido: el log diria
# "publicado" sin que nadie lo haya recibido.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Deja rastro en el log de cada publicacion con exchange, routing key y eventId.
logging.level.cl.duoc.pedidos360.orders.messaging=INFO

# ---------------------------------------------------------------------------
# Kafka (EP3)
# ---------------------------------------------------------------------------
# Los tres brokers del cluster. Desde el equipo anfitrion se usan los puertos
# publicados; dentro de Docker, KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
# (seccion 3.1 de la guia de EP3). Con los tres, el productor sigue funcionando
# si uno de los brokers no responde al arrancar.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}

# Key String (el codigo del pedido) y valor JSON a partir de los DTO tipados,
# como en las guias 3.2.2 y 3.3.2. JsonSerializer es el nombre que tiene en
# Spring Kafka 3.x el JacksonJsonSerializer de las guias (Spring Boot 4).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Sin la cabecera __TypeId__: el contrato entre productor y consumidor es el
# JSON, no el nombre de una clase Java de este proyecto.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Durabilidad: el broker confirma recien cuando el evento esta en las replicas
# sincronizadas (min.insync.replicas=2 en los topicos). La idempotencia evita
# que un reintento del productor deje el evento duplicado en la particion.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Si Kafka no responde, send() espera como maximo 5 s por los metadatos del
# topico en vez de los 60 s por defecto: la respuesta al usuario no puede
# quedar colgada porque el cluster de eventos este caido.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000

logging.level.cl.duoc.pedidos360.orders.kafka=INFO
